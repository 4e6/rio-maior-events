name: probe
# Run by hand: does each source answer a GitHub runner? Uploads only a per-source summary.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Lisbon
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Collect
        run: bun src/cli/collect.ts "$RUNNER_TEMP/collected" || echo "collect exited $?"
      - name: Summarize
        run: |
          bun tools/probe_summary.ts "$RUNNER_TEMP/collected/index.json" | tee summary.txt
      - name: Fetch each list page with Bun
        run: |
          UA=$(bun -e 'import { USER_AGENT } from "./src/net.ts"; console.log(USER_AGENT)')
          NODE_EXTRA_CA_CERTS=certs/intermediates.pem bun tools/probe_bun.ts "$UA" | tee bun.txt
      - name: Fetch the sites that refuse a direct request through the fallback proxy
        # Optional: skipped without the secret. One GET per site; prints statuses only.
        env:
          FALLBACK_PROXY_URL: ${{ secrets.FALLBACK_PROXY_URL }}
        run: bun tools/probe_proxy.ts | tee proxy.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-summary
          path: |
            summary.txt
            bun.txt
            proxy.txt
          retention-days: 7
